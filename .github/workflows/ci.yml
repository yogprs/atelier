name: build-and-publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atelier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # These are public build-time values, never secrets. Override them with
  # repository variables when the API or frontend domain changes.
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://madgo.my.id' }}
  VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN || 'https://madgo.my.id' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs vue-tsc and Vite. Add `pnpm lint` and `pnpm test`
      # here once lint and test tooling exist.
      - name: Typecheck and build
        run: pnpm build

  docker-build:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: atelier:pr
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_API_ORIGIN=${{ env.VITE_API_ORIGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image and SPA fallback
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f atelier-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name atelier-ci -p 8080:8080 atelier:pr
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = "200"
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:8080/auth/callback | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:8080/app/chats | grep -q '<div id="app">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/does-not-exist.js)" = "404"

  publish:
    if: |
      github.repository == 'yogprs/atelier' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=main-{{date 'YYYYMMDDHHmmss'}}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_API_ORIGIN=${{ env.VITE_API_ORIGIN }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
