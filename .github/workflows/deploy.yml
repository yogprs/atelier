name: Deploy Atelier

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ENV
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/atelier:latest
            ghcr.io/${{ github.repository_owner }}/atelier:${{ github.sha }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            cd /home/yoga/apps/atelier

            docker compose pull

            docker compose up -d

            docker image prune -f
