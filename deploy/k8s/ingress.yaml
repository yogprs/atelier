apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atelier
  namespace: apps
  labels:
    app.kubernetes.io/name: atelier
  annotations:
    # TLS diterminasi Cloudflare; origin HTTP ke Traefik.
spec:
  ingressClassName: traefik
  rules:
    - host: atelier.web.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atelier
                port:
                  name: http
