apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atelier
  namespace: atelier
  labels:
    app.kubernetes.io/name: atelier
  annotations:
    # Uncomment if cert-manager is installed with this ClusterIssuer.
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - atelier.web.id
      secretName: atelier-web-tls
  rules:
    - host: atelier.web.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atelier
                port:
                  name: http
